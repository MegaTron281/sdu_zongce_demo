<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>综测成绩管理平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">SDU</div>
          <div>
            <h1>山东大学 · 综测服务大厅</h1>
            <p>Comprehensive Assessment Service Hall</p>
          </div>
        </div>

        <div class="role-switch" aria-label="角色切换">
          <button class="role-button active" data-role="student">普通学生</button>
          <button class="role-button" data-role="reviewer">审核学生</button>
          <button class="role-button" data-role="admin">管理员</button>
        </div>

        <nav class="nav-list" id="navList" aria-label="页面导航"></nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="phaseLabel">日常申报期</p>
            <h2 id="pageTitle">首页 / 活动广场</h2>
          </div>
          <div class="topbar-actions">
            <label class="phase-toggle">
              <span>综测汇总期</span>
              <input id="phaseToggle" type="checkbox" />
            </label>
            <button class="icon-button" id="notificationButton" title="通知">3</button>
          </div>
        </header>

        <section class="notice-strip" id="noticeStrip"></section>
        <section class="content" id="content"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
